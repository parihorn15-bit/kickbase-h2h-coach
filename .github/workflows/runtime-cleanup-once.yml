name: One-time runtime cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/runtime-cleanup-once.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove state polling and delayed startup render
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('phase230-dev31.js')
          s=p.read_text()
          s=s.replace("  let running=false,last='';function syncAll", "  let running=false;function syncAll")
          s=s.replace("\n  function signature(){const d=getData();return JSON.stringify((d?.players||[]).map(p=>[p.id,p.name,p.team,p.position,p.buyDate,p.buyPrice,p.soldDate,p.salePrice]).sort())}", "")
          s=s.replace("\n  setInterval(()=>{const s=signature();if(s&&s!==last){last=s;syncAll({reason:'central-watch'})}},1100);", "")
          s=s.replace("\n  setTimeout(()=>{syncAll({reason:'startup-stabilization',render:true});last=signature()},1800);", "")
          if 'central-watch' in s or 'startup-stabilization' in s or 'setInterval(()=>{const s=signature()' in s:
              raise SystemExit('cleanup patterns still present')
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add phase230-dev31.js
          git diff --cached --quiet && exit 0
          git commit -m "Remove central state polling and delayed rerender"
          git push
