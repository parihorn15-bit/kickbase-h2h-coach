name: Retire legacy service worker completely

on:
  push:
    paths:
      - '.github/workflows/retire-legacy-sw.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove registration and install one-time recovery worker
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          # Remove every legacy service-worker registration block from the page.
          html = re.sub(
              r'\n?<script>\s*if\([\'\"]serviceWorker[\'\"] in navigator.*?navigator\.serviceWorker\.register\([^<]*?</script>',
              '', html, flags=re.S
          )
          html = re.sub(
              r'\n?<script>.*?navigator\.serviceWorker\.register\([^<]*?</script>',
              '', html, flags=re.S
          )

          # Run cleanup before normal application scripts whenever fresh HTML is reached.
          cleanup = '''\n<script id="h2hLegacySwCleanup">\n(() => {\n  if (!('serviceWorker' in navigator)) return;\n  navigator.serviceWorker.getRegistrations().then(regs =>\n    Promise.all(regs.map(reg => reg.unregister()))\n  ).catch(() => {});\n  if ('caches' in window) caches.keys().then(keys =>\n    Promise.all(keys.filter(k => /^(h2h-coach-|kickbase)/i.test(k)).map(k => caches.delete(k)))\n  ).catch(() => {});\n})();\n</script>\n'''
          if 'id="h2hLegacySwCleanup"' not in html:
              html = html.replace('</head>', cleanup + '</head>', 1)

          # New asset key: force every 3.0 runtime module past any normal HTTP cache.
          html = re.sub(r'300statecore\d+', '300statecore4', html)
          index.write_text(html, encoding='utf-8')

          version = Path('version.js')
          ver = version.read_text(encoding='utf-8')
          ver = re.sub(r"assetKey:\s*'[^']+'", "assetKey: '300statecore4'", ver)
          ver = re.sub(r"cacheName:\s*'[^']+'", "cacheName: 'h2h-coach-v300-statecore4'", ver)
          version.write_text(ver, encoding='utf-8')

          # Existing old controlled pages can still receive this update. It performs one
          # controlled migration navigation, then unregisters itself. Fresh index.html
          # never registers a worker again, so this cannot loop.
          sw = Path('service-worker.js')
          sw.write_text('''// 3.0.0 legacy-worker recovery bridge. Fresh pages never register this worker.\nself.addEventListener('install', event => { self.skipWaiting(); });\nself.addEventListener('activate', event => {\n  event.waitUntil((async () => {\n    const keys = await caches.keys();\n    await Promise.all(keys.filter(k => /^(h2h-coach-|kickbase)/i.test(k)).map(k => caches.delete(k)));\n    await self.clients.claim();\n    const clients = await self.clients.matchAll({type:'window', includeUncontrolled:true});\n    await self.registration.unregister();\n    for (const client of clients) {\n      try {\n        const url = new URL(client.url);\n        if (url.searchParams.get('h2hFresh') === '300statecore4') continue;\n        url.searchParams.set('h2hFresh', '300statecore4');\n        await client.navigate(url.href);\n      } catch (_) {}\n    }\n  })());\n});\n// No fetch handler. No APP_UPDATED messages. No recurring reloads.\n''', encoding='utf-8')

          assert 'navigator.serviceWorker.register' not in html
          assert 'h2hLegacySwCleanup' in html
          assert '300statecore4' in html
          assert "assetKey: '300statecore4'" in ver
          PY
      - name: Commit recovery cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.js service-worker.js
          git commit -m "Retire legacy service worker and force clean 3.0 boot"
          git push
