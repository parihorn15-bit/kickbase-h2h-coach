name: Bundesliga-Vereinsdaten aktualisieren
on:
  schedule:
    - cron: "35 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/update-club-data.mjs"
      - ".github/workflows/update-club-data.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vereinsdaten laden
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/update-club-data.mjs
