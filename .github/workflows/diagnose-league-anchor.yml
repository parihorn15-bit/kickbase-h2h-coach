name: Diagnose League Anchor
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Locate model parse error
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('phase230-league-anchor.js','utf8');
          const marker='const MODEL = ';
          const markerPos=src.indexOf(marker);
          const open=src.indexOf('{',markerPos+marker.length);
          if(markerPos<0||open<0)throw new Error('MODEL start missing');
          let depth=0,inString=false,escaped=false,close=-1;
          for(let i=open;i<src.length;i++){
            const c=src[i];
            if(inString){
              if(escaped){escaped=false;continue;}
              if(c==='\\'){escaped=true;continue;}
              if(c==='"')inString=false;
              continue;
            }
            if(c==='"'){inString=true;continue;}
            if(c==='{')depth++;
            else if(c==='}'){
              depth--;
              if(depth===0){close=i;break;}
            }
          }
          console.log('FILE_CHARS',src.length,'OPEN',open,'CLOSE',close,'DEPTH',depth,'IN_STRING',inString);
          if(close<0)throw new Error('MODEL object never closes');
          const json=src.slice(open,close+1);
          console.log('MODEL_CHARS',json.length,'MODEL_END',JSON.stringify(json.slice(-160)));
          console.log('AFTER_MODEL',JSON.stringify(src.slice(close+1,Math.min(src.length,close+260))));
          try{
            const model=JSON.parse(json);
            console.log('MODEL_JSON_OK',model.schema_version,Object.keys(model.entities?.teams||{}).length,Object.keys(model.state?.current_ownership||{}).length);
          }catch(error){
            console.log('MODEL_JSON_ERROR',error.message);
            const m=String(error.message).match(/position (\d+)/i);
            if(m){const p=Number(m[1]);console.log('ERROR_POSITION',p);console.log('CONTEXT_BEFORE',JSON.stringify(json.slice(Math.max(0,p-180),p)));console.log('CONTEXT_AFTER',JSON.stringify(json.slice(p,p+180)));}
            throw error;
          }
          NODE
