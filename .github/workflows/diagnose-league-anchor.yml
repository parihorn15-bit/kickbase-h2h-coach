name: Diagnose League Anchor
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Locate model parse error
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('phase230-league-anchor.js','utf8');
          const marker='const MODEL = ';
          const start=src.indexOf(marker);
          const end=src.indexOf(';',start+marker.length);
          if(start<0||end<0)throw new Error('MODEL assignment boundaries missing');
          const json=src.slice(start+marker.length,end).trim();
          console.log('MODEL_CHARS',json.length,'FILE_CHARS',src.length,'JSON_END',JSON.stringify(json.slice(-160)));
          try{
            JSON.parse(json);
            console.log('MODEL_JSON_OK');
          }catch(error){
            console.log('MODEL_JSON_ERROR',error.message);
            const m=String(error.message).match(/position (\d+)/i);
            if(m){
              const p=Number(m[1]);
              console.log('ERROR_POSITION',p);
              console.log('CONTEXT_BEFORE',JSON.stringify(json.slice(Math.max(0,p-180),p)));
              console.log('CONTEXT_AFTER',JSON.stringify(json.slice(p,p+180)));
            }
            throw error;
          }
          NODE
