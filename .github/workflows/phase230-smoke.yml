name: Production Smoke Check
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths: ["version.js","phase230*.js","phase230-mobile.css","app.js","cloud.js","config.js","service-worker.js","index.html","scripts/update-club-data.mjs",".github/workflows/phase230-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check version.js
          node --check app.js
          node --check cloud.js
          node --check config.js
          node --check service-worker.js
          node --check phase230.js
          node --check phase230-league-anchor.js
          for file in phase230-dev*.js; do node --check "$file"; done
          node --check phase230-st1-anchor.js
          node --check phase230-st1-corrections.js
          node --check scripts/update-club-data.mjs
      - name: Canonical release wiring
        run: |
          grep -q "version.js" config.js
          grep -q "H2H_RELEASE" config.js
          grep -q "H2H_RELEASE" phase230.js
          ! grep -q "const APP_VERSION='" phase230.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const context={};vm.createContext(context);
          vm.runInContext(fs.readFileSync('version.js','utf8'),context);
          const r=context.H2H_RELEASE;
          if(!r)throw new Error('H2H_RELEASE missing');
          if(!/^\d+\.\d+\.\d+$/.test(r.version))throw new Error(`Bad version ${r.version}`);
          if(!/^[a-zA-Z0-9_-]+$/.test(r.assetKey))throw new Error(`Bad assetKey ${r.assetKey}`);
          if(!r.cacheName.includes(`v${r.version.replace(/\./g,'')}`))throw new Error('cacheName/version mismatch');
          console.log(`Release ${r.version} / ${r.assetKey}`);
          NODE
      - name: Reload-free startup guards
        run: |
          grep -q "h2hLegacySwCleanup" index.html
          ! grep -q "navigator.serviceWorker.register" index.html
          ! grep -q "location.reload()" app.js
          ! grep -q "location.reload()" phase230.js
          ! grep -q "APP_UPDATED" service-worker.js
          ! grep -q "addEventListener('fetch'" service-worker.js
          ! grep -q 'addEventListener("fetch"' service-worker.js
          grep -q "registration.unregister" service-worker.js
          grep -q "caches.keys" service-worker.js
      - name: Runtime centralization guards
        run: |
          grep -q "phase230-dev31.js" phase230.js
          grep -q "phase230-dev29.js" phase230.js
          ! grep -q "phase230-dev30.js" phase230.js
          grep -q "runtime-ready" phase230.js
          grep -q "h2h300SyncHornHistoryIntoTransfers" phase230.js
          grep -q "H2H_STATE_CORE" phase230.js
          ! grep -q "MutationObserver" phase230.js
          ! grep -q "setInterval" phase230.js
      - name: Horn history deterministic cutover
        run: |
          grep -q "EXPECTED_UNIQUE=72" phase230-dev29.js
          grep -q "EXPECTED_LIFECYCLES=43" phase230-dev29.js
          grep -q "EXPECTED_ACTIVE=14" phase230-dev29.js
          grep -q "EXPECTED_SOLD=29" phase230-dev29.js
          grep -q "needsRepair" phase230-dev29.js
          grep -q "h2hCanonicalHornVerified" phase230-dev29.js
          grep -q "Single-pass only" phase230-dev29.js
          ! grep -q "setTimeout(boot" phase230-dev29.js
          ! grep -q "setInterval" phase230-dev29.js
      - name: Core state guards
        run: |
          grep -q "dedupePlayers" phase230-dev31.js
          grep -q "canonicalName" phase230-dev31.js
          grep -q "posLabel" phase230-dev31.js
          grep -q "syncCanonicalRoster" phase230-dev31.js
          grep -q "repairLineup" phase230-dev31.js
          grep -q "syncAll" phase230-dev31.js
      - name: Ownership and lineup guards
        run: |
          grep -q "h2h300ReconcileOwnership" phase230-dev27.js
          grep -q "duplicateSquadOwnership" phase230-dev27.js
          grep -q "phase230LiveLineups" phase230-dev16.js
          grep -q "writeLiveLineupV1=function" phase230-dev16.js
          ! grep -q "new MutationObserver" phase230-dev16.js
          ! grep -q "new MutationObserver" phase230-dev17.js
          ! grep -q "new MutationObserver" phase230-dev18.js
      - name: Historical data guards
        run: |
          grep -q "h2h230ValidateHistoricalPoints" phase230-dev26.js
          grep -q "pointsFinal230" phase230-dev18.js
          grep -q "manual-reconstruction" phase230-dev17.js
          grep -q "/competitions/BL1/matches" scripts/update-club-data.mjs
      - name: Mobile and production guards
        run: |
          test -s phase230-mobile.css
          grep -q "env(safe-area-inset-top)" phase230-mobile.css
          grep -q "min-height:44px" phase230-mobile.css
          grep -q "H2H_PHASE230_FULL_USE=true" phase230-dev5.js
          grep -q "H2H_PHASE230_TEST_CLOUD_READONLY=false" phase230-dev5.js
