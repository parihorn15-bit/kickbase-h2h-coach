name: Phase 2.3.0 Test Package

on:
  push:
    branches: ["phase-2.3.0"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build isolated test package
        shell: bash
        run: |
          mkdir -p dist/kickbase-h2h-coach-2.3.0-test
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dist' ./ dist/kickbase-h2h-coach-2.3.0-test/
          cat > dist/kickbase-h2h-coach-2.3.0-test/START_2.3.0_TEST.bat <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          title Kickbase H2H Coach 2.3.0 TEST
          echo ================================================
          echo Kickbase H2H Coach 2.3.0 TEST
          echo ================================================
          echo.
          echo Suche eine funktionierende lokale Server-Laufzeit...

          py -3 --version >nul 2>nul
          if %errorlevel%==0 goto :PY

          python --version >nul 2>nul
          if %errorlevel%==0 goto :PYTHON

          npx --version >nul 2>nul
          if %errorlevel%==0 goto :NPX

          echo.
          echo FEHLER: Weder eine funktionierende Python- noch Node.js-Laufzeit wurde gefunden.
          echo Das ist nur ein Problem des lokalen Teststarters; deine produktive App ist nicht betroffen.
          echo.
          echo Bitte dieses Fenster offen lassen und im Chat einen Screenshot schicken.
          pause
          exit /b 1

          :PY
          echo Gefunden: Python Launcher ^(py -3^)
          echo Starte Server auf http://localhost:8765 ...
          start "Kickbase 2.3.0 Test Browser" cmd /c "timeout /t 2 /nobreak >nul & start \"\" http://localhost:8765"
          py -3 -m http.server 8765
          goto :SERVER_ENDED

          :PYTHON
          echo Gefunden: Python
          echo Starte Server auf http://localhost:8765 ...
          start "Kickbase 2.3.0 Test Browser" cmd /c "timeout /t 2 /nobreak >nul & start \"\" http://localhost:8765"
          python -m http.server 8765
          goto :SERVER_ENDED

          :NPX
          echo Gefunden: Node.js / npx
          echo Starte Server auf http://localhost:8765 ...
          start "Kickbase 2.3.0 Test Browser" cmd /c "timeout /t 3 /nobreak >nul & start \"\" http://localhost:8765"
          npx --yes http-server . -p 8765 -c-1
          goto :SERVER_ENDED

          :SERVER_ENDED
          echo.
          echo Der lokale Testserver wurde beendet oder konnte nicht gestartet werden.
          echo Bitte diese Meldung im Chat zeigen.
          pause
          exit /b 1
          EOF
          cat > dist/kickbase-h2h-coach-2.3.0-test/TESTANLEITUNG.txt <<'EOF'
          KICKBASE H2H COACH 2.3.0 TEST

          1. ZIP vollständig entpacken.
          2. START_2.3.0_TEST.bat doppelklicken.
          3. Das schwarze Serverfenster MUSS während des Tests geöffnet bleiben.
          4. Im Browser muss unten rechts "2.3.0 TEST · Cloud-Schreiben AUS" erscheinen.
          5. Calcio-Rom-Aufstellungsscreenshot importieren, bevor weitere Transfers importiert werden.
          6. Erwartung: 9 erkannt = 9 gespeichert = 9 auf dem Spielfeld sichtbar.
          7. Danach die zugehörigen Transfers importieren.
          8. Erwartung: weiterhin 9 sichtbar; Namen/Vereine dürfen nur angereichert bzw. verknüpft werden.
          9. Screenshots von Vorschau, gespeicherter Aufstellung und Ergebnis nach Transferimport im Chat senden.

          WICHTIG: Dieser Teststand ist NICHT main und Cloud-Schreibzugriffe sind im Testmodus deaktiviert.
          EOF
      - name: Upload 2.3.0 test package
        uses: actions/upload-artifact@v4
        with:
          name: kickbase-h2h-coach-2.3.0-test
          path: dist/kickbase-h2h-coach-2.3.0-test
          retention-days: 7
